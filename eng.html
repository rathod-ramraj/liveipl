<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="author" content="sayan">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      width:100%;height:100%;background:#0a0a0a;overflow:hidden;
      font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      touch-action:manipulation;
      -webkit-text-size-adjust:100%;
    }
    #player-container{
      position:fixed;inset:0;width:100%;height:100%;background:#000;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;
    }
    .shaka-video-container{
      position:absolute!important;inset:0!important;
      width:100%!important;height:100%!important;
      background-color:#000!important;
    }
    video{
      width:100%!important;height:100%!important;
      object-fit:contain;background:#000;
    }
    video.mode-fill{object-fit:fill!important}
    video.mode-cover{object-fit:cover!important}

    /* subtle status badge */
    #status{
      position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:9997;
      display:flex;align-items:center;gap:7px;padding:6px 14px 6px 10px;
      background:rgba(10,10,10,.88);border:1px solid rgba(255,255,255,.07);
      font-size:11.5px;font-weight:500;letter-spacing:.2px;border-radius:24px;
      pointer-events:none;opacity:0;transition:opacity .25s ease,transform .25s ease;
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      white-space:nowrap;box-shadow:0 2px 14px rgba(0,0,0,.45);
      color:#c0c0c0;
    }
    #status.show{opacity:1;transform:translateY(0)}
    .st-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block;background:#60a5fa}
    #status.live .st-dot{background:#22d3a0;animation:dot-pulse 2s ease-in-out infinite}
    #status.warn .st-dot{background:#fb923c;animation:dot-pulse 1s ease-in-out infinite}
    #status.err .st-dot{background:#f87171}
    @keyframes dot-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.55)}}

    /* custom fit button */
    .sp-fit-btn{
      background:transparent!important;border:none!important;cursor:pointer!important;
      padding:0 7px!important;min-width:32px!important;opacity:.75;
      display:flex;align-items:center;justify-content:center;height:100%;
      transition:opacity .15s;color:#fff!important;touch-action:manipulation;
    }
    .sp-fit-btn:hover{opacity:1}
    .fit-pill{
      font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 7px;
      border-radius:4px;line-height:1;border:1.5px solid rgba(255,255,255,.28);
      color:rgba(255,255,255,.8);pointer-events:none;white-space:nowrap;
      transition:border-color .2s,color .2s;
    }
    .sp-fit-btn:hover .fit-pill{border-color:rgba(255,255,255,.55);color:#fff}
    .sp-fit-btn.mode-fill .fit-pill{border-color:#38bdf8;color:#38bdf8}
    .sp-fit-btn.mode-cover .fit-pill{border-color:#a78bfa;color:#a78bfa}
    .shaka-controls-container button{color:#fff!important}
    .shaka-controls-button-panel > * { touch-action:manipulation }

    @media(max-width:380px){
      .fit-pill{font-size:9px;padding:2px 5px}
      .sp-fit-btn{min-width:28px!important;padding:0 4px!important}
    }
  </style>
</head>
<body>
  <div id="player-container">
    <video id="video" autoplay muted playsinline webkit-playsinline x5-playsinline preload="auto"></video>
  </div>
  <div id="status"><span class="st-dot"></span><span id="statusText">Live</span></div>
  <div id="sf-sign" style="position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none" aria-hidden="true">sayan</div>

  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
  <script>
  (function() {
    "use strict";

    var SF_AUTHOR = "sayan";

    // --- Configuration ---
    var COOKIE_API_URL = "https://allrounder2-0.pages.dev/api/sony-3.json";

    var CONFIG = {
      // Star Sports 1 HD
      streamUrl: "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_BTS/WDVLive/index.mpd",
      keys: [
        "45825561f4ef516691a9e16d1d35dd1d:3951fe7fbf4b0b33e6246fc401f76797",
        "bf95222d9be85d85a91281e796e99481:bc932276031b3e63758cf67b147c3557",
        "f217e9fe133e5b948c323abef1e39b47:63640dc4430d14003def0c97a2dbab4d",
        "eda3132244745c10920b01536bc8a75b:2b5f8bdba279032943a040078bb22b35",
        "06dd6287c4b956419d15d6c8e513aeed:a82d6b850b5c281c0054fc6d55e1c6ba"
      ]
    };

    var video      = document.getElementById("video");
    var container  = document.getElementById("player-container");
    var statusEl   = document.getElementById("status");
    var statusText = document.getElementById("statusText");

    // Enforce mobile-safe video attributes
    video.muted = true;
    video.defaultMuted = true;
    video.playsInline = true;
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");

    var statusTimer = null;

    function setStatus(msg, type, dur) {
      if (!statusEl) return;
      statusText.textContent = msg || "Live";
      statusEl.className = "show " + (type || "live");
      if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
      if (dur !== 0) {
        statusTimer = setTimeout(function() {
          statusEl.className = statusEl.className.replace("show", "").trim();
          statusTimer = null;
        }, dur || 4000);
      }
    }

    function buildClearKeys(list) {
      var out = {};
      (list || []).forEach(function(entry) {
        var kid, key;
        if (typeof entry === "string") {
          var p = entry.split(":");
          kid = p[0]; key = p[1];
        } else if (entry && typeof entry === "object") {
          kid = entry.kid || entry.keyId;
          key = entry.key;
        }
        if (kid && key) {
          out[String(kid).trim().toLowerCase()] = String(key).trim().toLowerCase();
        }
      });
      return out;
    }

    // ----- Fetch cookie from external API -----
    async function fetchCookieFromApi() {
      try {
        setStatus("Fetching cookie…", "warn", 0);
        const resp = await fetch(COOKIE_API_URL, {
          cache: "no-store",
          headers: { "Accept": "application/json" }
        });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const data = await resp.json();
        const cookie = (data.cookie || "").trim();
        if (!cookie) throw new Error("No cookie field in response");
        return cookie;
      } catch (err) {
        console.error("[cookie] fetch failed:", err);
        setStatus("Cookie fetch failed", "err", 0);
        throw err;
      }
    }

    function injectFitButton(containerEl, videoEl) {
      var panel = containerEl.querySelector(".shaka-controls-button-panel");
      if (!panel) return false;

      var anchor = panel.querySelector(".shaka-fullscreen-button");
      var FITS = ["contain", "fill", "cover"];
      var FIT_LABELS = { contain: "Fit", fill: "Fill", cover: "Zoom" };
      var fitIdx = 0;

      var fitBtn = document.createElement("button");
      fitBtn.type = "button";
      fitBtn.className = "sp-fit-btn";
      fitBtn.title = "Video Fit: " + FIT_LABELS.contain;
      fitBtn.setAttribute("aria-label", "Cycle Video Fit Mode");
      fitBtn.innerHTML = '<span class="fit-pill">—</span>';

      if (anchor) panel.insertBefore(fitBtn, anchor);
      else panel.appendChild(fitBtn);

      var currentRatio = "—";

      function applyFit(i) {
        fitIdx = i;
        var m = FITS[i];
        videoEl.classList.remove("mode-fill", "mode-cover");
        if (m === "fill") videoEl.classList.add("mode-fill");
        if (m === "cover") videoEl.classList.add("mode-cover");
        fitBtn.classList.remove("mode-fill", "mode-cover");
        if (m !== "contain") fitBtn.classList.add("mode-" + m);
        fitBtn.title = "Video Fit: " + FIT_LABELS[m];
        var pill = fitBtn.querySelector(".fit-pill");
        if (pill) pill.textContent = (m === "contain") ? currentRatio : FIT_LABELS[m];
      }

      fitBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        applyFit((fitIdx + 1) % FITS.length);
      });

      // Reset fit on exiting fullscreen (desktop + iOS)
      ["fullscreenchange", "webkitfullscreenchange"].forEach(function(ev) {
        document.addEventListener(ev, function() {
          if (!(document.fullscreenElement || document.webkitFullscreenElement)) applyFit(0);
        });
      });
      videoEl.addEventListener("webkitendfullscreen", function() {
        applyFit(0);
      });

      // iPhone fallback for Shaka fullscreen button
      if (anchor) {
        anchor.addEventListener("click", function() {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (videoEl.webkitEnterFullscreen && !document.fullscreenEnabled && !document.webkitFullscreenEnabled) {
              videoEl.webkitEnterFullscreen();
            }
          }
        }, { capture: true });
      }

      function ratioLabel(w, h) {
        if (!w || !h) return "—";
        function gcd(a, b) { return b ? gcd(b, a % b) : a; }
        var g = gcd(w, h) || 1, rw = w/g, rh = h/g;
        var named = { "16:9": 16/9, "4:3": 4/3, "21:9": 21/9, "1:1": 1, "9:16": 9/16, "3:2": 3/2, "5:4": 5/4, "2:1": 2 };
        var real = w/h;
        var best = null, bestD = 0.02;
        Object.keys(named).forEach(function(k) {
          var d = Math.abs(named[k] - real);
          if (d < bestD) { bestD = d; best = k; }
        });
        if (best) return best;
        if (rw <= 40 && rh <= 40) return rw + ":" + rh;
        return real.toFixed(2) + ":1";
      }

      var ratioTries = 0;
      function updateRatio() {
        var pill = fitBtn.querySelector(".fit-pill");
        if (!pill) return;
        if (videoEl.videoWidth > 0) {
          currentRatio = ratioLabel(videoEl.videoWidth, videoEl.videoHeight);
          if (FITS[fitIdx] === "contain") pill.textContent = currentRatio;
          ratioTries = 0;
        } else if (ratioTries < 15) {
          ratioTries++;
          setTimeout(updateRatio, 700);
        }
      }

      videoEl.addEventListener("loadedmetadata", function() { ratioTries = 0; updateRatio(); });
      videoEl.addEventListener("resize", updateRatio);
      videoEl.addEventListener("timeupdate", function onFirstFrame() {
        videoEl.removeEventListener("timeupdate", onFirstFrame);
        updateRatio();
      });
      updateRatio();

      return true;
    }

    async function initPlayer() {
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) {
        setStatus("Browser Not Supported", "err", 0);
        return;
      }

      // ---- 1. Fetch cookie from API ----
      var cookieValue;
      try {
        cookieValue = await fetchCookieFromApi();
      } catch (e) {
        return;
      }

      var player = new shaka.Player();
      await player.attach(video);

      var ui = new shaka.ui.Overlay(player, container, video);
      ui.configure({
        addBigPlayButton: true,
        controlPanelElements: [
          "play_pause",
          "time_and_duration",
          "mute",
          "spacer",
          "quality",
          "picture_in_picture",
          "fullscreen"
        ],
        seekBarColors: {
          base: "#828282",
          buffered: "#ffc336",
          played: "#1fc7ff"
        }
      });

      var injectCount = 0;
      (function tryInject() {
        if (injectFitButton(container, video)) return;
        if (++injectCount < 8) setTimeout(tryInject, 150);
      })();

      var clearKeys = buildClearKeys(CONFIG.keys);
      var keyCount = Object.keys(clearKeys).length;

      if (keyCount === 0) {
        setStatus("No DRM keys configured", "err", 0);
        return;
      }

      // Stable live DASH configuration:
      // lowLatencyMode is false to allow smooth buffering and clean pause/resume
      player.configure({
        drm: { clearKeys: clearKeys },
        manifest: {
          defaultPresentationDelay: 6,
          dash: {
            autoCorrectDrift: true
          }
        },
        streaming: {
          lowLatencyMode: false,
          bufferingGoal: 15,
          rebufferingGoal: 2,
          bufferBehind: 30,
          jumpLargeGaps: true,
          safeSeekOffset: 5
        }
      });

      player.getNetworkingEngine().registerRequestFilter(function(type, request) {
        request.headers["Referer"]    = "https://www.jiotv.com/";
        request.headers["User-Agent"] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
        request.headers["Cookie"]     = cookieValue;

        var urlCookie = cookieValue.indexOf("__hdnea__=") === 0 ? cookieValue.slice(10) : cookieValue;
        if ((type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
             type === shaka.net.NetworkingEngine.RequestType.SEGMENT) &&
            request.uris[0].indexOf("__hdnea__") === -1) {
          var sep = request.uris[0].indexOf("?") === -1 ? "?" : "&";
          request.uris[0] += sep + "__hdnea__=" + urlCookie;
        }
      });

      // Auto-refresh cookie if 403 occurs during playback or after long pause
      player.getNetworkingEngine().registerResponseFilter(async function(type, response) {
        if (response.status === 403) {
          try {
            var freshCookie = await fetchCookieFromApi();
            if (freshCookie) {
              cookieValue = freshCookie;
              player.retryStreaming();
            }
          } catch (_) {}
        }
      });

      try {
        setStatus("Loading…", "warn", 0);
        await player.load(CONFIG.streamUrl);
        setStatus("Live", "live", 4000);
        var playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(function(err) {
            console.warn("Autoplay restricted:", err);
            setStatus("Tap to play", "warn", 0);
          });
        }
      } catch (e) {
        console.error("Player load error:", e);
        setStatus("Error loading stream", "err", 0);
      }

      // Non-intrusive initial unmuting on first user gesture
      function unmuteOnGesture() {
        video.muted = false;
        if (statusText && statusText.textContent === "Tap to play") {
          video.play().catch(function() {});
          setStatus("Live", "live", 2000);
        }
        window.removeEventListener("click", unmuteOnGesture);
        window.removeEventListener("touchend", unmuteOnGesture);
      }
      window.addEventListener("click", unmuteOnGesture, { once: true });
      window.addEventListener("touchend", unmuteOnGesture, { once: true, passive: true });

      // Clean pause & resume lifecycle (no aborting seeks during play transition)
      video.addEventListener("pause", function() {
        setStatus("Paused", "warn", 0);
      });

      video.addEventListener("playing", function() {
        setStatus("Live", "live", 3000);
        // If the stream was paused so long that the paused timestamp expired from server DVR window:
        if (player && player.isLive()) {
          try {
            var range = player.seekRange();
            if (range && range.start && video.currentTime < range.start) {
              player.goToLive();
            }
          } catch (_) {}
        }
      });

      video.addEventListener("waiting", function() {
        if (!video.paused) {
          setStatus("Buffering…", "warn", 0);
        }
      });

      player.addEventListener("error", function(ev) {
        var err = ev.detail;
        console.error("Shaka error:", err);
        if (err && err.severity === shaka.util.Error.Severity.RECOVERABLE) {
          try { player.retryStreaming(); return; } catch(_) {}
        }
        if (err && (err.code === 3016 || err.code === 3015)) {
          try { player.retryStreaming(); return; } catch(_) {}
        }
        setStatus("Stream error: " + (err && err.code ? err.code : ""), "err", 5000);
      });

      try { video.dataset.sf = SF_AUTHOR; } catch (e) {}
    }

    document.addEventListener("DOMContentLoaded", initPlayer);
    try { window.__sf_author__ = SF_AUTHOR; } catch (e) {}
  })();
  </script>
</body>
</html>
