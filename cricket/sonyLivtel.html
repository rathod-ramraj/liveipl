<!DOCTYPE html>
<html lang="en">
<head>
  <script disable-devtool-auto src="https://cdn.jsdelivr.net/npm/disable-devtool@latest/disable-devtool.min.js" url="about:blank"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#0a0a0a;overflow:hidden;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    #player-container{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
    #player-container, .shaka-video-container, .shaka-controls-container, video {
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    video{width:100%;height:100%;object-fit:contain;background:#000}
    #brightness-dimmer {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      transition: opacity .05s linear;
    }
    /* subtle status badge (inspired by second design) */
    #status{
      position:fixed;top:max(16px,env(safe-area-inset-top));right:16px;z-index:9997;
      display:flex;align-items:center;gap:7px;padding:6px 15px 6px 11px;
      background:rgba(10,10,10,.88);border:1px solid rgba(255,255,255,.07);
      font-size:11.5px;font-weight:500;letter-spacing:.2px;border-radius:24px;
      pointer-events:none;opacity:0;transition:opacity .25s ease,transform .25s ease;
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      white-space:nowrap;box-shadow:0 2px 14px rgba(0,0,0,.45);
      color:#c0c0c0;
    }
    #status.show{opacity:1;transform:translateY(0)}
    .st-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block;background:#ff0000}
    #status.live .st-dot{background:#ff0000;animation:dot-pulse 2s ease-in-out infinite}
    #status.warn .st-dot{background:#fb923c;animation:dot-pulse 1s ease-in-out infinite}
    #status.err .st-dot{background:#ff0000}
    @keyframes dot-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.55)}}
    /* custom fit button (like second example) */
    .sp-fit-btn{background:transparent!important;border:none!important;cursor:pointer!important;padding:0 7px!important;min-width:auto!important;opacity:.75;display:flex;align-items:center;justify-content:center;height:100%;transition:opacity .15s;color:#fff!important}
    .sp-fit-btn:hover{opacity:1}
    .fit-pill{font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 7px;border-radius:4px;line-height:1;border:1.5px solid rgba(255,255,255,.28);color:rgba(255,255,255,.8);pointer-events:none;white-space:nowrap;transition:border-color .2s,color .2s}
    .sp-fit-btn:hover .fit-pill{border-color:rgba(255,255,255,.55);color:#fff}
    .sp-fit-btn.mode-fill .fit-pill{border-color:#ff0000;color:#ff0000}
    .sp-fit-btn.mode-cover .fit-pill{border-color:#ff0000;color:#ff0000}
    .shaka-controls-container button{color:#fff!important}
    .shaka-video-container{background-color:#000!important}
    @media(max-width:380px){.fit-pill{font-size:9px;padding:2px 5px}}

    /* Hotstar-style Gesture Indicators */
    .gesture-overlay{position:absolute;inset:0;pointer-events:none;z-index:9998;overflow:hidden}
    .gesture-pill{
      position:absolute;top:50%;transform:translateY(-50%) scale(0.92);
      display:flex;flex-direction:column;align-items:center;justify-content:space-between;
      width:46px;height:180px;padding:14px 8px;
      background:rgba(12,12,15,.82);border:1px solid rgba(255,255,255,.14);
      border-radius:26px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      box-shadow:0 8px 32px rgba(0,0,0,.6);color:#fff;
      pointer-events:none;opacity:0;
      transition:opacity .2s ease,transform .2s cubic-bezier(.16,1,.3,1)
    }
    .gesture-pill.show{opacity:1;transform:translateY(-50%) scale(1)}
    .gesture-pill.left{left:28px}
    .gesture-pill.right{right:28px}
    .gesture-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
    .gesture-bar-track{position:relative;width:5px;flex:1;margin:10px 0;background:rgba(255,255,255,.2);border-radius:999px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
    .gesture-bar-fill{width:100%;height:100%;background:#ff0000;border-radius:999px;transition:height .05s linear}
    .gesture-text{font-size:11px;font-weight:700;letter-spacing:.3px;color:#fff;font-variant-numeric:tabular-nums;flex-shrink:0;text-align:center}
    @media(max-width:480px){
      .gesture-pill{width:40px;height:156px;padding:12px 6px;border-radius:22px}
      .gesture-pill.left{left:14px}
      .gesture-pill.right{right:14px}
      .gesture-icon{width:18px;height:18px}
      .gesture-text{font-size:10px}
    }
  </style>
</head>
<body>

<div id="player-container">
  <div id="brightness-dimmer"></div>
  <video id="video" autoplay muted playsinline preload="metadata"></video>
  <div id="gesture-overlay" class="gesture-overlay">
    <div id="gesture-indicator-left" class="gesture-pill left">
      <div class="gesture-icon" id="gesture-icon-left">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </div>
      <div class="gesture-bar-track">
        <div class="gesture-bar-fill" id="gesture-fill-left" style="height:100%"></div>
      </div>
      <div class="gesture-text" id="gesture-text-left">100%</div>
    </div>
    <div id="gesture-indicator-right" class="gesture-pill right">
      <div class="gesture-icon" id="gesture-icon-right">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </div>
      <div class="gesture-bar-track">
        <div class="gesture-bar-fill" id="gesture-fill-right" style="height:100%"></div>
      </div>
      <div class="gesture-text" id="gesture-text-right">100%</div>
    </div>
  </div>
</div>

<!-- status badge (optional but neat) -->
<div id="status"><span class="st-dot"></span><span id="statusText">Live</span></div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
<script>
(function() {
  "use strict";

  // ----- CONFIG (exactly as first code) -----
  const CONFIG = {
    streamUrl: "https://jiotvmblive.cdn.jio.com/bpk-tv/Ten_4_Telugu_MOB/WDVLive/index.mpd",
    keyId: "494a8a050ecc5a22adab6dc304ead1b4",
    key: "9b3bbf2ccb71a876a2bbeb9cde00d7bf",
    cookieUrl: "https://allrounder2-0.pages.dev/api/Sony-3.json"
  };

  // ----- DOM refs -----
  const video = document.getElementById("video");
  const container = document.getElementById("player-container");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");

  // Gesture indicators
  const dimmerEl = document.getElementById("brightness-dimmer");
  const leftPill = document.getElementById("gesture-indicator-left");
  const leftFill = document.getElementById("gesture-fill-left");
  const leftText = document.getElementById("gesture-text-left");

  const rightPill = document.getElementById("gesture-indicator-right");
  const rightFill = document.getElementById("gesture-fill-right");
  const rightText = document.getElementById("gesture-text-right");
  const rightIcon = document.getElementById("gesture-icon-right");

  const VOL_HIGH_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
  const VOL_LOW_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
  const VOL_MUTE_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';

  let currentBrightness = 100;
  let currentVolume = 100;
  let activeGesture = null;
  let hideLeftTimer = null;
  let hideRightTimer = null;

  function showIndicator(side) {
    const el = side === "left" ? leftPill : rightPill;
    if (!el) return;
    el.classList.add("show");
    if (side === "left" && hideLeftTimer) {
      clearTimeout(hideLeftTimer);
      hideLeftTimer = null;
    }
    if (side === "right" && hideRightTimer) {
      clearTimeout(hideRightTimer);
      hideRightTimer = null;
    }
  }

  function scheduleHideIndicator(side) {
    const timer = setTimeout(function() {
      const el = side === "left" ? leftPill : rightPill;
      if (el) el.classList.remove("show");
    }, 700);
    if (side === "left") hideLeftTimer = timer;
    else hideRightTimer = timer;
  }

  function setBrightness(val) {
    currentBrightness = Math.min(100, Math.max(0, val));
    if (dimmerEl) {
      dimmerEl.style.opacity = (((100 - currentBrightness) / 100) * 0.88).toFixed(3);
    }
    const filterVal = Math.max(0.1, currentBrightness / 100);
    video.style.filter = "brightness(" + filterVal + ")";
    if (leftFill) leftFill.style.height = currentBrightness + "%";
    if (leftText) leftText.textContent = currentBrightness + "%";
    showIndicator("left");
  }

  function setVolume(val) {
    currentVolume = Math.min(100, Math.max(0, val));
    video.volume = currentVolume / 100;
    if (currentVolume > 0 && video.muted) {
      video.muted = false;
    } else if (currentVolume === 0 && !video.muted) {
      video.muted = true;
    }
    if (rightFill) rightFill.style.height = currentVolume + "%";
    if (rightText) rightText.textContent = currentVolume + "%";
    if (rightIcon) {
      if (currentVolume === 0 || video.muted) {
        rightIcon.innerHTML = VOL_MUTE_ICON;
      } else if (currentVolume < 50) {
        rightIcon.innerHTML = VOL_LOW_ICON;
      } else {
        rightIcon.innerHTML = VOL_HIGH_ICON;
      }
    }
    showIndicator("right");
  }

  video.addEventListener("volumechange", function() {
    if (!activeGesture) {
      currentVolume = video.muted ? 0 : Math.round(video.volume * 100);
      if (rightFill) rightFill.style.height = currentVolume + "%";
      if (rightText) rightText.textContent = currentVolume + "%";
      if (rightIcon) {
        if (currentVolume === 0 || video.muted) {
          rightIcon.innerHTML = VOL_MUTE_ICON;
        } else if (currentVolume < 50) {
          rightIcon.innerHTML = VOL_LOW_ICON;
        } else {
          rightIcon.innerHTML = VOL_HIGH_ICON;
        }
      }
    }
  });

  function initSwipeGestures() {
    const videoContainer = container.querySelector(".shaka-video-container") || container;

    // Ensure dimmer and gesture-overlay are inside videoContainer so they persist in fullscreen
    const dimmer = document.getElementById("brightness-dimmer");
    const overlay = document.getElementById("gesture-overlay");
    if (videoContainer !== container) {
      if (dimmer && dimmer.parentNode !== videoContainer) videoContainer.appendChild(dimmer);
      if (overlay && overlay.parentNode !== videoContainer) videoContainer.appendChild(overlay);
    }

    let startX = 0;
    let startY = 0;
    let startVal = 0;
    let isTracking = false;
    let wasSwiping = false;

    function shouldIgnore(target) {
      return !!(target && (
        target.closest(".shaka-bottom-controls, .shaka-controls-button-panel, .shaka-overflow-menu, .shaka-play-button-container, .sp-fit-btn, #status, button, input")
      ));
    }

    function handleMove(clientY) {
      const rect = videoContainer.getBoundingClientRect();
      const travel = Math.min(Math.max(rect.height * 0.55, 180), 320);
      const deltaY = clientY - startY;
      const diff = (-deltaY / travel) * 100;
      const newVal = Math.min(100, Math.max(0, Math.round(startVal + diff)));
      if (activeGesture === "brightness") {
        setBrightness(newVal);
      } else if (activeGesture === "volume") {
        setVolume(newVal);
      }
    }

    // Touch events for mobile
    videoContainer.addEventListener("touchstart", function(e) {
      if (e.touches.length !== 1) { isTracking = false; return; }
      if (shouldIgnore(e.target)) return;

      const touch = e.touches[0];
      const rect = videoContainer.getBoundingClientRect();
      const x = touch.clientX - rect.left;

      startX = touch.clientX;
      startY = touch.clientY;
      activeGesture = null;
      isTracking = true;

      const isLeft = x < rect.width / 2;
      startVal = isLeft ? currentBrightness : currentVolume;
    }, { passive: true });

    videoContainer.addEventListener("touchmove", function(e) {
      if (!isTracking || e.touches.length !== 1) return;
      const touch = e.touches[0];
      const deltaX = touch.clientX - startX;
      const deltaY = touch.clientY - startY;

      if (!activeGesture) {
        if (Math.abs(deltaY) > 8 && Math.abs(deltaY) > Math.abs(deltaX)) {
          const rect = videoContainer.getBoundingClientRect();
          const x = touch.clientX - rect.left;
          activeGesture = (x < rect.width / 2) ? "brightness" : "volume";
        } else if (Math.abs(deltaX) > 10) {
          isTracking = false;
          return;
        }
      }

      if (activeGesture) {
        if (e.cancelable) e.preventDefault();
        handleMove(touch.clientY);
      }
    }, { passive: false });

    function endTouch() {
      if (activeGesture) {
        wasSwiping = true;
        setTimeout(function() { wasSwiping = false; }, 320);
        scheduleHideIndicator(activeGesture === "brightness" ? "left" : "right");
        activeGesture = null;
      }
      isTracking = false;
    }

    videoContainer.addEventListener("touchend", endTouch, { passive: true });
    videoContainer.addEventListener("touchcancel", endTouch, { passive: true });

    // Block accidental click on release after swipe
    videoContainer.addEventListener("click", function(e) {
      if (wasSwiping) {
        e.stopPropagation();
        e.preventDefault();
        wasSwiping = false;
      }
    }, true);

    // Mouse drag support for desktop simulation
    let isMouseDown = false;
    videoContainer.addEventListener("mousedown", function(e) {
      if (e.button !== 0 || shouldIgnore(e.target)) return;
      isMouseDown = true;
      startX = e.clientX;
      startY = e.clientY;
      activeGesture = null;
      const rect = videoContainer.getBoundingClientRect();
      const isLeft = (e.clientX - rect.left) < rect.width / 2;
      startVal = isLeft ? currentBrightness : currentVolume;
    });

    window.addEventListener("mousemove", function(e) {
      if (!isMouseDown) return;
      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;
      if (!activeGesture) {
        if (Math.abs(deltaY) > 8 && Math.abs(deltaY) > Math.abs(deltaX)) {
          const rect = videoContainer.getBoundingClientRect();
          activeGesture = ((startX - rect.left) < rect.width / 2) ? "brightness" : "volume";
        } else if (Math.abs(deltaX) > 10) {
          isMouseDown = false;
          return;
        }
      }
      if (activeGesture) {
        handleMove(e.clientY);
      }
    });

    window.addEventListener("mouseup", function() {
      if (isMouseDown) {
        isMouseDown = false;
        if (activeGesture) {
          wasSwiping = true;
          setTimeout(function() { wasSwiping = false; }, 320);
          scheduleHideIndicator(activeGesture === "brightness" ? "left" : "right");
          activeGesture = null;
        }
      }
    });
  }

  let statusTimer = null;

  function setStatus(msg, type, dur) {
    if (!statusEl) return;
    statusText.textContent = msg || "Live";
    statusEl.className = "show " + (type || "live");
    if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
    if (dur !== 0) {
      statusTimer = setTimeout(function() {
        statusEl.className = statusEl.className.replace("show", "").trim();
        statusTimer = null;
      }, dur || 4000);
    }
  }

  // ----- fit button injection (from second code) -----
  function injectFitButton(containerEl, videoEl) {
    const panel = containerEl.querySelector(".shaka-controls-button-panel");
    if (!panel) return false;

    const anchor = panel.querySelector(".shaka-fullscreen-button");
    const FITS = ["contain", "fill", "cover"];
    const FIT_LABELS = { contain: "Fit", fill: "Fill", cover: "Zoom" };
    let fitIdx = 0;

    const fitBtn = document.createElement("button");
    fitBtn.className = "sp-fit-btn";
    fitBtn.title = "Video Fit: " + FIT_LABELS.contain;
    fitBtn.setAttribute("aria-label", "Cycle Video Fit Mode");
    fitBtn.innerHTML = '<span class="fit-pill">—</span>';

    if (anchor) panel.insertBefore(fitBtn, anchor);
    else panel.appendChild(fitBtn);

    let currentRatio = "—";

    function applyFit(i) {
      fitIdx = i;
      const m = FITS[i];
      videoEl.classList.remove("mode-fill", "mode-cover");
      if (m === "fill") videoEl.classList.add("mode-fill");
      if (m === "cover") videoEl.classList.add("mode-cover");
      fitBtn.classList.remove("mode-fill", "mode-cover");
      if (m !== "contain") fitBtn.classList.add("mode-" + m);
      fitBtn.title = "Video Fit: " + FIT_LABELS[m];
      const pill = fitBtn.querySelector(".fit-pill");
      if (pill) pill.textContent = (m === "contain") ? currentRatio : FIT_LABELS[m];
    }

    fitBtn.addEventListener("click", function(e) {
      e.stopPropagation();
      applyFit((fitIdx + 1) % FITS.length);
    });

    ["fullscreenchange", "webkitfullscreenchange"].forEach(function(ev) {
      document.addEventListener(ev, function() {
        if (!(document.fullscreenElement || document.webkitFullscreenElement)) applyFit(0);
      });
    });

    function ratioLabel(w, h) {
      if (!w || !h) return "—";
      function gcd(a, b) { return b ? gcd(b, a % b) : a; }
      const g = gcd(w, h) || 1, rw = w/g, rh = h/g;
      const named = { "16:9": 16/9, "4:3": 4/3, "21:9": 21/9, "1:1": 1, "9:16": 9/16, "3:2": 3/2, "5:4": 5/4, "2:1": 2 };
      const real = w/h;
      let best = null, bestD = 0.02;
      Object.keys(named).forEach(function(k) {
        const d = Math.abs(named[k] - real);
        if (d < bestD) { bestD = d; best = k; }
      });
      if (best) return best;
      if (rw <= 40 && rh <= 40) return rw + ":" + rh;
      return real.toFixed(2) + ":1";
    }

    let ratioTries = 0;
    function updateRatio() {
      const pill = fitBtn.querySelector(".fit-pill");
      if (!pill) return;
      if (videoEl.videoWidth > 0) {
        currentRatio = ratioLabel(videoEl.videoWidth, videoEl.videoHeight);
        if (FITS[fitIdx] === "contain") pill.textContent = currentRatio;
        ratioTries = 0;
      } else if (ratioTries < 15) {
        ratioTries++;
        setTimeout(updateRatio, 700);
      }
    }

    videoEl.addEventListener("loadedmetadata", function() { ratioTries = 0; updateRatio(); });
    videoEl.addEventListener("resize", updateRatio);
    videoEl.addEventListener("timeupdate", function onFirstFrame() {
      videoEl.removeEventListener("timeupdate", onFirstFrame);
      updateRatio();
    });
    updateRatio();

    return true;
  }

  // ----- main player init (first code logic) -----
  async function initPlayer() {
    // Polyfill & browser check
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) {
      setStatus("Browser Not Supported", "err", 0);
      return;
    }

    const player = new shaka.Player();
    await player.attach(video);

    // UI overlay
    const ui = new shaka.ui.Overlay(player, container, video);
    ui.configure({
      addBigPlayButton: true,
      controlPanelElements: [
        "play_pause",
        "mute",
        "time_and_duration",
        "spacer",
        "quality",
        "picture_in_picture",
        "fullscreen"
      ],
      seekBarColors: {
        base: "#828282",
        buffered: "#ffc336",
        played: "#ff0000"
      }
    });

    // Inject fit button (from second code)
    let injectCount = 0;
    (function tryInject() {
      if (injectFitButton(container, video)) return;
      if (++injectCount < 5) setTimeout(tryInject, 150);
    })();

    // Initialize Hotstar-style swipe gestures
    initSwipeGestures();

    // Player config (first code)
    player.configure({
      drm: { clearKeys: { [CONFIG.keyId]: CONFIG.key } },
      manifest: { defaultPresentationDelay: 5 },
      streaming: {
        lowLatencyMode: true,
        bufferingGoal: 10,
        rebufferingGoal: 2,
        safeSeekOffset: 5
      }
    });

    // Fetch cookie (first code)
    let cookieValue = "";
    try {
      const response = await fetch(CONFIG.cookieUrl, { cache: "no-store" });
      const data = await response.json();
      cookieValue = data.cookie || "";
    } catch(e) {
      console.warn("Cookie fetch failed, continuing without cookie");
    }

    if (cookieValue) {
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers["Referer"] = "https://www.jiotv.com/";
        request.headers["User-Agent"] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
        request.headers["Cookie"] = cookieValue;

        let urlCookie = cookieValue.startsWith("__hdnea__=") ? cookieValue.slice(10) : cookieValue;
        if ((type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
             type === shaka.net.NetworkingEngine.RequestType.SEGMENT) &&
            !request.uris[0].includes("__hdnea__")) {
          const sep = request.uris[0].includes("?") ? "&" : "?";
          request.uris[0] += sep + "__hdnea__=" + urlCookie;
        }
      });
    }

    // Load stream (first code)
    try {
      setStatus("Loading…", "warn", 0);
      await player.load(CONFIG.streamUrl);
      setStatus("Live", "live", 4000);
      video.play().catch(function() {});
    } catch(e) {
      console.error("Player load error:", e);
      setStatus("Error loading stream", "err", 0);
    }

    // Auto unmute on play (first code)
    video.addEventListener("play", function() {
      video.muted = false;
    });

    // Also unmute on any user interaction (like second)
    function unmuteOnce() { video.muted = false; }
    container.addEventListener("pointerdown", unmuteOnce, { capture: true, once: true });
    container.addEventListener("click", unmuteOnce, { capture: true, once: true });

    // Basic error / recovery (keep status updated)
    player.addEventListener("error", function(ev) {
      const err = ev.detail;
      setStatus("Stream error: " + (err.code || ""), "err", 5000);
    });
  }

  // kick off
  document.addEventListener("DOMContentLoaded", initPlayer);
})();
</script>
