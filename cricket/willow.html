<style>
:root{
  --ks-size:78px;
  --ks-speed:1.15s;
  --ks-color:#147cf5;
  --ks-stroke:8
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;background:#0a0a0a;overflow:hidden;
  font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none
}
#overlay{
  position:fixed;inset:0;background:#0a0a0a;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:0
}
#overlay svg{
  width:var(--ks-size);height:var(--ks-size);
  animation:ks-spin var(--ks-speed) linear infinite;
  pointer-events:none;display:block;overflow:visible
}
@keyframes ks-spin{to{transform:rotate(360deg)}}
@keyframes ks-fade{0%,100%{opacity:1}50%{opacity:.18}}
@media(prefers-reduced-motion:reduce){
  #overlay svg{animation:ks-fade calc(var(--ks-speed) * 2) ease-in-out infinite}
}

  color:#686868;font-size:11px;letter-spacing:.8px;

  text-transform:uppercase
}
#pc{
  position:fixed;inset:0;background:#000;display:flex;
  align-items:center;justify-content:center;touch-action:manipulation
}
video{width:100%;height:100%;object-fit:contain;background:#000}
video.mode-fill{object-fit:fill}
video.mode-cover{object-fit:cover}
#status{
  position:fixed;
  bottom:calc(66px + env(safe-area-inset-bottom,0px));

  transform:translateY(6px);
  z-index:9997;

  padding:0 14px 0 10px;
  height:26px;min-width:156px;max-width:272px;
  overflow:hidden;white-space:nowrap;
  background:linear-gradient(160deg,rgba(9,9,11,.94) 0%,rgba(15,15,18,.90) 100%);

  box-shadow:0 2px 16px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  font-size:9px;font-weight:700;letter-spacing:1.1px;
  text-transform:uppercase;font-variant-numeric:tabular-nums;

  transition:opacity .22s ease,transform .22s ease
}
#status.show{opacity:1;transform:translateY(0)}
.st-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;display:inline-block}

#status.ok   .st-dot{background:#60a5fa}

#status.live .st-dot{background:#22d3a0;animation:dot-pulse 2s ease-in-out infinite}
#status.warn {color:#f2c94c}

#status.err  {color:#fca5a5}
#status.err  .st-dot{background:#f87171}
@keyframes dot-pulse{
  0%,100%{opacity:1;transform:scale(1)}

<script>
(function(){
"use strict";

var WILLOW_CHANNELS = [
  {
    name: "Willow 1",
    manifest: "https://abfjk4haaaaaaaamkitc5445rybm6.bia-cf.live.pv-cdn.net/iad-nitro/live/clients/dash/enc/r6vs6zdomz/out/v1/d34a7d179f4f49f2b2f08ec490165d8b/cenc.mpd",

  },
  {

    drmKeys: {
      "ba4284442c87f52ddeaa95c65d236805": "56f0808d1f1fbfc0703b384081f1d340"
    }
  }
];

var $overlay = document.getElementById("overlay");
var $loadMsg = document.getElementById("loadMsg");
var $status  = document.getElementById("status");
var $pc      = document.getElementById("pc");
var $vid     = document.getElementById("v");
var _stTmr   = null;

var player = null;
var currentChannelIndex = 0;

function getTier(){
  var mem   = navigator.deviceMemory || 4;
  var cores = navigator.hardwareConcurrency || 4;
  var mob   = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var conn  = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  var net   = conn ? (conn.effectiveType || "4g") : "4g";
  if(!mob) return "high";
  if(mem <= 1.5 || cores <= 2 || net === "slow-2g" || net === "2g") return "low";
  if(mem <= 3   || cores <= 4) return "mid";
  return "high";
}

var TIER = getTier();
var PROF = {
  low:  {buf:4,  reBuf:1.5, behind:10, maxH:480,  maxBw:1000000, bwEst:400000 },
  mid:  {buf:7,  reBuf:1.5, behind:20, maxH:720,  maxBw:3000000, bwEst:1000000},
  high: {buf:10, reBuf:1.5, behind:25, maxH:1080, maxBw:0,       bwEst:2000000}
}[TIER];

var FITS       = ["contain","fill","cover"];
var FIT_LABELS = {contain:"Fit", fill:"Fill", cover:"Zoom"};

function toast(msg, type, dur){
  $status.innerHTML = '<span class="st-dot"></span><span>' + msg + '</span>';
  $status.className = "show " + (type || "ok");
  if(_stTmr){ clearTimeout(_stTmr); _stTmr = null; }
  if(dur !== 0){
    _stTmr = setTimeout(function(){
      $status.className = $status.className.replace("show","").trim();
      _stTmr = null;
    }, dur || 4000);
  }
}

function setMsg(m)    { if($loadMsg) $loadMsg.textContent = m; }
function hideOverlay(){ if($overlay) $overlay.style.display = "none"; }

function errMsg(msg){
  setMsg(msg);
  $overlay.style.display = "flex";
  toast(msg, "err", 0);
}

function shakaErrStr(e){
  if(!e) return "Playback Error";
  var cat = {1:"Network",2:"Text",3:"Media",4:"Manifest",5:"Stream",6:"DRM",7:"Player"};
  var s = (cat[e.category] || "Error") + " " + e.category + ":" + e.code;
  if(e.data && e.data[0] && typeof e.data[0] === "string")
    s += " — " + e.data[0].slice(0, 72);
  return s;
}

function ratioLabel(w, h){
  if(!w || !h) return "—";
  function gcd(a, b){ return b ? gcd(b, a % b) : a; }
  var g = gcd(w, h) || 1, rw = w/g, rh = h/g;
  var named = {
    "16:9":16/9, "4:3":4/3, "21:9":21/9, "1:1":1,
    "9:16":9/16, "3:2":3/2, "5:4":5/4, "2:1":2
  };
  var real = w/h, best = null, bestD = 0.02;
  Object.keys(named).forEach(function(k){
    var d = Math.abs(named[k] - real);
    if(d < bestD){ bestD = d; best = k; }
  });
  if(best) return best;
  if(rw <= 40 && rh <= 40) return rw + ":" + rh;
  return real.toFixed(2) + ":1";
}

function injectControls(container, vid){
  var panel = container.querySelector(".shaka-controls-button-panel");
  if(!panel) return false;

  var anchor = panel.querySelector(".shaka-fullscreen-button");
  var fitIdx  = 0;
  var fitBtn  = document.createElement("button");
  fitBtn.className = "sp-btn sp-fit-btn";
  fitBtn.title     = "Video Fit: " + FIT_LABELS.contain;
  fitBtn.setAttribute("aria-label", "Cycle Video Fit Mode");
  fitBtn.innerHTML = '<span class="fit-pill">—</span>';

  if(anchor) panel.insertBefore(fitBtn, anchor);
  else       panel.appendChild(fitBtn);

  var currentRatio = "—";
  function applyFit(i){
    fitIdx = i;
    var m = FITS[i];
    vid.classList.remove("mode-fill","mode-cover");
    if(m === "fill")  vid.classList.add("mode-fill");
    if(m === "cover") vid.classList.add("mode-cover");
    fitBtn.classList.remove("mode-fill","mode-cover");
    if(m !== "contain") fitBtn.classList.add("mode-" + m);
    fitBtn.title = "Video Fit: " + FIT_LABELS[m];
    var pill = fitBtn.querySelector(".fit-pill");
    if(pill) pill.textContent = (m === "contain") ? currentRatio : FIT_LABELS[m];
  }

  fitBtn.addEventListener("click", function(e){
    e.stopPropagation();
    applyFit((fitIdx + 1) % FITS.length);
  });

  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement || document.webkitFullscreenElement)) applyFit(0);
    });
  });

  var _ratioTries = 0;
  function updateRatio(){
    var pill = fitBtn.querySelector(".fit-pill");
    if(!pill) return;
    if(vid.videoWidth > 0){
      currentRatio = ratioLabel(vid.videoWidth, vid.videoHeight);
      if(FITS[fitIdx] === "contain") pill.textContent = currentRatio;
      _ratioTries = 0;
    } else if(_ratioTries < 15){
      _ratioTries++;
      setTimeout(updateRatio, 700);
    }
  }

  vid.addEventListener("loadedmetadata", function(){ _ratioTries = 0; updateRatio(); });
  vid.addEventListener("resize", updateRatio);
  vid.addEventListener("timeupdate", function onFirstFrame(){
    vid.removeEventListener("timeupdate", onFirstFrame);
    updateRatio();
  });
  updateRatio();

  return true;
}

function updateChannelTabs(idx){
  var tabs = document.querySelectorAll(".ch-tab");
  tabs.forEach(function(tab, i){
    var active = i === idx;
    tab.classList.toggle("active", active);
    tab.setAttribute("aria-selected", active ? "true" : "false");
  });
}

function initChannelTabs(){
  var tabs = document.querySelectorAll(".ch-tab");
  tabs.forEach(function(tab){
    tab.addEventListener("click", function(){
      var idx = parseInt(tab.dataset.index, 10);
      if(idx !== currentChannelIndex && WILLOW_CHANNELS[idx]){
        switchChannel(idx);
      }
    });
  });
}

async function switchChannel(idx){
  currentChannelIndex = idx;
  updateChannelTabs(idx);
  var ch = WILLOW_CHANNELS[idx];
  document.title = ch.name + " HD Live";

  toast("Loading " + ch.name, "warn", 2500);
  try{
    if(player){
      player.configure("drm.clearKeys", ch.drmKeys);
      await player.load(ch.manifest);
      await $vid.play().catch(function(){});
      toast("Playing " + ch.name, "live", 3500);
    }
  }catch(err){
    console.error("Failed to load channel:", err);
    toast(shakaErrStr(err), "err", 5000);
  }
}

async function startPlayer(){
  $pc.style.display = "flex";
  initChannelTabs();

  // Check URL query param e.g. ?ch=2 or ?channel=3
  var params = new URLSearchParams(window.location.search);
  var chParam = params.get("ch") || params.get("channel") || params.get("id");
  if(chParam){
    var pIdx = parseInt(chParam, 10);
    if(pIdx >= 1 && pIdx <= WILLOW_CHANNELS.length){
      currentChannelIndex = pIdx - 1;
    }
  }
  updateChannelTabs(currentChannelIndex);

  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){ errMsg("Browser Not Supported."); return; }

  player = new shaka.Player();
  await player.attach($vid);

  new shaka.ui.Overlay(player, $pc, $vid).configure({
    controlPanelElements:[
      "play_pause","mute","volume",
      "time_and_duration","spacer",
      "quality","picture_in_picture","fullscreen"
    ],
    seekBarColors:{
      base:    "#828282",
      buffered:"#ffc336",
      played:  "#1fc7ff"
    }
  });

  var _injectCount = 0;
  (function tryInject(){
    if(injectControls($pc, $vid)) return;
    if(++_injectCount < 5) setTimeout(tryInject, 150);
  })();

  var currentCh = WILLOW_CHANNELS[currentChannelIndex];
  var url     = currentCh.manifest;
  var drmKeys = currentCh.drmKeys;

  var restrictionsRelaxed = false;
  var thermalApplied      = false;
  var sessionStart        = Date.now();

  var thermalTimer = setInterval(function(){
    if(Date.now() - sessionStart < 60*60*1000) return;
    clearInterval(thermalTimer);
    if(thermalApplied) return;
    thermalApplied = true;
    try{
      player.configure("streaming.bufferBehind", 8);
      if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
        player.configure("abr.restrictions.maxHeight", Math.min(PROF.maxH, 720));
      }
    }catch(_){}
  }, 60000);

  function buildCfg(){
    var effMaxH = (thermalApplied && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent))
      ? Math.min(PROF.maxH, 720) : PROF.maxH;
    var restr = {};
    if(!restrictionsRelaxed){
      if(effMaxH < 1080) restr.maxHeight    = effMaxH;
      if(PROF.maxBw > 0) restr.maxBandwidth = PROF.maxBw;
    }
    return {
      preferredAudioLanguage: '',
      preferredAudioCodecs: ['mp4a.40.2','mp4a.40.5','ac-3','ec-3','opus','flac'],
      drm:{ clearKeys: WILLOW_CHANNELS[currentChannelIndex].drmKeys },
      manifest:{
        defaultPresentationDelay:4,
        ignoreTextStreamFailures:true,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      streaming:{
        lowLatencyMode:false,
        bufferingGoal:PROF.buf,
        rebufferingGoal:PROF.reBuf,
        bufferBehind:PROF.behind,
        safeSeekOffset:4,
        stallEnabled:true,
        stallThreshold:1,
        stallSkip:.3,
        inaccurateManifestTolerance:0,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      abr:{
        enabled:true,
        defaultBandwidthEstimate:PROF.bwEst,
        switchInterval:4,
        restrictions:restr
      }
    };
  }

  player.configure(buildCfg());

  var refreshing = false;
  var retries = 0;
  var lastTry = 0;
  var started = false;
  var stallTmr = null;
  var _bufState = false;
  var _lastCurr = 0;
  var seekState = {active:false,wantsDvr:false,target:null,timer:null};

  function clearStallTimer(){
    if(stallTmr){ clearTimeout(stallTmr); stallTmr = null; }
  }

  function clearBuf(){
    _bufState = false;
    clearStallTimer();
  }

  function getSeekRange(){
    try{
      var range = player.seekRange();
      if(range && isFinite(range.start) && isFinite(range.end) && range.end > range.start) return range;
    }catch(_){}
    return null;
  }

  function isDvrPosition(time){
    var range = getSeekRange();
    return !!range && isFinite(time) && time < range.end - 7;
  }

  function rememberPosition(){
    var time = $vid.currentTime;
    if(isDvrPosition(time)){
      seekState.wantsDvr = true;
      seekState.target = time;
      return;
    }
    seekState.wantsDvr = false;
    seekState.target = null;
  }

  function restoreDvrPosition(time){
    var range = getSeekRange();
    if(!range || !isFinite(time)) return false;
    var lower = Math.min(range.end - .25, range.start + .25);
    var upper = Math.max(lower, range.end - .75);
    var target = Math.min(Math.max(time, lower), upper);
    try{
      $vid.currentTime = target;
      seekState.wantsDvr = true;
      seekState.target = target;
      return Math.abs(target - time) < 1;
    }catch(_){
      return false;
    }
  }

  function bufferingMessage(){
    return seekState.wantsDvr || seekState.active ? "Loading Replay · Please Wait" : "Buffering · Fetching Segments";
  }

  function onBufResume(){
    if(!_bufState) return;
    var wasDvr = seekState.wantsDvr;
    clearBuf();
    if(!refreshing) toast(wasDvr ? "Replay · Playing Behind Live" : "On Air · Stream Active", wasDvr ? "ok" : "live", 2600);
  }

  function scheduleRecovery(delay){
    clearStallTimer();
    stallTmr = setTimeout(function(){
      stallTmr = null;
      if(!refreshing && started && !$vid.paused && !seekState.active) reload();
    }, delay);
  }

  function unmuteOnce(){
    if($vid && $vid.muted){
      $vid.muted = false;
    }
  }
  $pc.addEventListener("pointerdown", unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("click", unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("keydown", unmuteOnce, {capture:true,once:true});
  window.addEventListener("pointerdown", unmuteOnce, {capture:true,once:true});
  window.addEventListener("click", unmuteOnce, {capture:true,once:true});
  window.addEventListener("touchstart", unmuteOnce, {capture:true,once:true});

  function onSeeking(){
    seekState.active = true;
    if(seekState.timer) clearTimeout(seekState.timer);
    rememberPosition();
    clearStallTimer();
    if(started && !$vid.paused){
      _bufState = true;
      toast(bufferingMessage(), "warn", 0);
    }
  }

  function onSeeked(){
    rememberPosition();
    if(seekState.timer) clearTimeout(seekState.timer);
    seekState.timer = setTimeout(function(){
      seekState.active = false;
      seekState.timer = null;
      if(_bufState && started && !$vid.paused) scheduleRecovery(5000);
    }, 7000);
    if($vid.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA && !$vid.paused) onBufResume();
  }

  $vid.addEventListener("timeupdate", function(){
    if($vid.paused || $vid.ended || !started || refreshing) return;
    var time = $vid.currentTime;
    if(time > _lastCurr + .01){
      _lastCurr = time;
      onBufResume();
    }
  });

  async function reload(){
    var now = Date.now();
    if(refreshing || now - lastTry < 1500) return;
    if(retries >= 5){ toast("Stream Unavailable · Max Retries Reached", "err", 0); return; }
    rememberPosition();
    var resumeAt = seekState.wantsDvr ? seekState.target : null;
    refreshing = true;
    lastTry = now;
    retries++;
    clearStallTimer();
    toast(resumeAt !== null ? "Reconnecting Replay · Attempt " + retries + " Of 5" : "Reconnecting · Attempt " + retries + " Of 5", "warn", 0);
    try{
      var activeCh = WILLOW_CHANNELS[currentChannelIndex];
      player.configure("drm.clearKeys", activeCh.drmKeys);
      await player.load(activeCh.manifest, resumeAt === null ? undefined : resumeAt);
      var restored = resumeAt === null ? false : restoreDvrPosition(resumeAt);
      await $vid.play().catch(function(){});
      retries = 0;
      if(resumeAt !== null && !restored) toast("Replay Position Expired · Starting At Earliest Available", "ok", 4000);
      else toast(resumeAt !== null ? "Replay · Resuming Selected Position" : "On Air · Stream Active", resumeAt !== null ? "ok" : "live", 4000);
    }catch(_){
      setTimeout(reload, Math.min(1000 * Math.pow(2, retries - 1), 8000));
    }finally{
      refreshing = false;
    }
  }

  var RECOVERABLE = [1001,1002,1003,4012,6006,6007,7000,7001,7002];

  player.addEventListener("error", function(ev){
    var err = ev.detail;
    var code = err && err.code;
    if(code === 4014 && !restrictionsRelaxed){
      rememberPosition();
      var recoveryPoint = seekState.wantsDvr ? seekState.target : null;
      restrictionsRelaxed = true;
      refreshing = true;
      player.configure(buildCfg());
      toast("Adjusting Stream Quality", "warn", 2000);
      player.load(WILLOW_CHANNELS[currentChannelIndex].manifest, recoveryPoint === null ? undefined : recoveryPoint)
        .then(function(){
          if(recoveryPoint !== null) restoreDvrPosition(recoveryPoint);
          return $vid.play();
        })
        .then(function(){ toast(recoveryPoint !== null ? "Replay · Playing Behind Live" : "On Air · Stream Active", recoveryPoint !== null ? "ok" : "live", 4000); })
        .catch(function(){
          refreshing = false;
          reload();
        })
        .finally(function(){ refreshing = false; });
      return;
    }
    if(RECOVERABLE.indexOf(code) !== -1){
      _bufState = true;
      toast(bufferingMessage(), "warn", 0);
      if(!seekState.active) scheduleRecovery(1500);
    }else{
      toast(shakaErrStr(err), "err", 6000);
    }
  });

  try{
    setMsg("Loading Stream");
    toast("Loading " + currentCh.name + " · Please Wait", "warn", 0);
    await player.load(url);
    hideOverlay();
    try{
      await $vid.play();
      toast("Live · " + currentCh.name, "live", 3500);
    }catch(_){
      toast("Tap To Play / Unmute", "ok", 4000);
    }
  }catch(_){
    hideOverlay();
    toast("Connection Error · Retrying Now", "warn", 0);
    setTimeout(reload, 1500);
    return;
  }

  function onStall(){
    if(refreshing || $vid.paused) return;
    _bufState = true;
    toast(bufferingMessage(), "warn", 0);
    if(!started || seekState.active) return;
    scheduleRecovery(9000);
  }

  function onPlaying(){
    started = true;
    onBufResume();
  }

  function onCanPlay(){
    if(started && !_bufState) return;
    if(started && !$vid.paused) onBufResume();
  }

  $vid.addEventListener("seeking", onSeeking);
  $vid.addEventListener("seeked", onSeeked);
  $vid.addEventListener("waiting", onStall);
  $vid.addEventListener("stalled", onStall);
  $vid.addEventListener("playing", onPlaying);
  $vid.addEventListener("canplay", onCanPlay);
  $vid.addEventListener("pause", function(){
    if(!seekState.active) clearBuf();
  });
  $vid.addEventListener("error", function(){
    if(!refreshing){
      _bufState = true;
      toast(bufferingMessage(), "warn", 0);
      if(!seekState.active) scheduleRecovery(1500);
    }
  });

  var resumeAfterVisibilityChange = false;
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){
      resumeAfterVisibilityChange = started && !$vid.paused;
      return;
    }
    setTimeout(function(){
      if(resumeAfterVisibilityChange && started && $vid.paused && !refreshing) $vid.play().catch(function(){});
      resumeAfterVisibilityChange = false;
    }, 400);
  });

  var netConn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if(netConn){
    netConn.addEventListener("change", function(){
      if(!player || restrictionsRelaxed) return;
      var t = netConn.effectiveType || "4g";
      var h = t === "slow-2g" || t === "2g" ? 240 : t === "3g" ? 480 : PROF.maxH;
      try{ player.configure("abr.restrictions.maxHeight", h); }catch(_){}
      if(h < PROF.maxH) toast("Slow Network · Reducing Quality","warn",3000);
    });
  }
}

document.addEventListener("DOMContentLoaded", startPlayer);
})();
</script>
</body>
</html>
