name: Update Cricket Matches

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-generate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Fetch cricket matches JSON
      run: |
        python fetch_and_generate.py
        
    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add api/cricket.json
        git diff --staged --quiet || (git commit -m "Auto-update: Cricket matches $(date +'%Y-%m-%d %H:%M:%S')" && git pull --rebase origin main && git push)
